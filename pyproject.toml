[project]
name = "natural-language-metrics-service"
version = "0.1.0"
description = "Governed natural-language access to deterministic metrics."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
norecursedirs = ["evaluation", "eval", ".venv", ".git"]
