    expected_outcome: "clarify"
    expected_metric_id: "net_revenue"
    request: {"metric_id":"net_revenue","dimensions":[],"filters":[{"dimension":"brand","operator":"eq","values":["UnknownBrand"]}],"time_range":{"start":null,"end":null,"relative":"all_time"},"grain":"total"}
  - id: "undefined"
    question: "What is customer lifetime value?"
    expected_outcome: "refuse"
    expected_metric_id: null
    request: null
  - id: "bad_dimension"
    question: "Show orders by category."
    expected_outcome: "refuse"
    expected_metric_id: "orders"
    request: {"metric_id":"orders","dimensions":["category"],"filters":[],"time_range":{"start":null,"end":null,"relative":"all_time"},"grain":"total"}
  - id: "empty_net"
    question: "What was net revenue in January 2020?"
    expected_outcome: "empty_result"
    expected_metric_id: "net_revenue"
    request: {"metric_id":"net_revenue","dimensions":[],"filters":[],"time_range":{"start":"2020-01-01","end":"2020-02-01","relative":null},"grain":"total"}
