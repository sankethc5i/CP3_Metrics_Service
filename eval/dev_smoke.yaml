purpose: temporary development smoke set; never locked evaluation
cases:
  - id: "net"
    question: "What is net revenue last month?"
    expected_outcome: "answer"
    expected_metric_id: "net_revenue"
    request: {"metric_id":"net_revenue","dimensions":[],"filters":[],"time_range":{"start":null,"end":null,"relative":"last_month"},"grain":"total"}
  - id: "gross"
    question: "Show gross revenue by category."
    expected_outcome: "answer"
    expected_metric_id: "gross_revenue"
    request: {"metric_id":"gross_revenue","dimensions":["category"],"filters":[],"time_range":{"start":null,"end":null,"relative":"all_time"},"grain":"total"}
  - id: "aov"
    question: "What is average order value?"
