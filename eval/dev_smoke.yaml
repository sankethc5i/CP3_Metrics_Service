    question: "How many new customers signed up?"
    expected_outcome: "answer"
    expected_metric_id: "new_customers"
    request: {"metric_id":"new_customers","dimensions":[],"filters":[],"time_range":{"start":null,"end":null,"relative":"all_time"},"grain":"total"}
  - id: "ambiguous_revenue"
    question: "What is revenue?"
    expected_outcome: "clarify"
    expected_metric_id: null
    request: null
  - id: "ambiguous_region"
    question: "Show gross revenue by region."
    expected_outcome: "clarify"
    expected_metric_id: "gross_revenue"
    request: {"metric_id":"gross_revenue","dimensions":["order_region"],"filters":[],"time_range":{"start":null,"end":null,"relative":"all_time"},"grain":"total"}
